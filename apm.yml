name: rfhub-skills
version: 0.8.0
description: >-
  Agent skills and Cursor/Claude instructions for consuming Robot Framework Hub
  from a suite repo — MCP workflows plus hub-compatible Robot sources.
author: kerpo
license: MIT
dependencies:
  apm: []
  # Standard hub, declared so `apm install KerpoOrg/rfhub-skills` wires the MCP
  # too (direct dependencies only; transitive consumers need
  # --trust-transitive-mcp). Self-hosted hubs override this in their own apm.yml
  # or with `apm install --mcp rf-hub --transport http --url "$RFHUB_MCP_URL"`.
  mcp:
    - name: rf-hub
      registry: false
      transport: http
      url: "https://rfhub.kerpo.org/api/mcp"
      headers:
        X-Rfhub-Skills-Version: "0.8.0"
  # Optional Robot Framework language server (Claude Code / Copilot CLI only).
  # APM writes the runtime config but does NOT install the `robotcode` binary
  # (see README "Robot language server"). Enhancement only, not required for
  # hub authoring. Language id `robotframework` matches RobotCode's VS Code
  # `contributes.languages` (`".robot"` / `".resource"`).
  lsp:
    - name: robotcode
      command: robotcode
      args: ["language-server", "--stdio"]
      extensionToLanguage:
        ".robot": robotframework
        ".resource": robotframework
      transport: stdio
devDependencies:
  apm: []
  # Hub developers: `apm install` in this repo wires the Compose hub without
  # hand-editing config. `apm install` of this package as a dependency excludes
  # devDependencies, so suite repos do not receive it.
  mcp:
    - name: rfhub-dev
      registry: false
      transport: http
      url: "http://127.0.0.1:2998/api/mcp"
      headers:
        X-Rfhub-Skills-Version: "0.8.0"
includes: auto
targets:
  - claude
  - cursor
scripts: {}
